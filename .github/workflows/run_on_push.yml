name: Tests

on:
  push:
    branches:
      - annika/master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # The README install, plus the test extra.
      - name: Install
        run: pip install -e ".[test]"

      # Every pipeline end to end on stars within 10 pc, plus the detector unit tests.
      - name: Run tests
        run: pytest -v -rfEX

      # The README quickstart; also check the figure landed where the README says.
      - name: Run the quickstart demo
        run: |
          python sim.py
          test -f results/figures/analysis/flat_transit_rv_3x3/flat_transit_rv_3x3_otegi.png
